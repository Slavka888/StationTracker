name: stationtracker

services:
  postgres:
    image: postgres:17-alpine
    container_name: stationtracker-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_stations.sql:/docker-entrypoint-initdb.d/10-init-stations.sql:ro

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: stationtracker-backend:local
    container_name: stationtracker-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_credentials

      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO

    secrets:
      - firebase_credentials

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    restart: unless-stopped


volumes:
  postgres_data:


secrets:
  firebase_credentials:
    file: ./secrets/stationtracker-68165-firebase-adminsdk-fbsvc-4f0099fbbd.json